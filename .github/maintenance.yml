# Agenda de manutenção — itens com data previsível de revisão.
#
# O workflow .github/workflows/maintenance-check.yml lê este arquivo todo mês e abre ou atualiza
# uma Issue quando um item entra na janela de alerta (due menos alert_days <= hoje).
#
# Campos: id (kebab-case), titulo, due (YYYY-MM-DD), alert_days, link (opcional), acao (opcional).
# Ao resolver um item, remova-o daqui, ou ajuste a data se for recorrente.

items:
  - id: react-router-v7
    titulo: Migrar react-router-dom 6 → 7 (alerta moderate de redirecionamento aberto só corrigido na v7)
    due: 2027-02-10
    alert_days: 30
    link: https://reactrouter.com/upgrading/v6
    acao: Ligar as future flags da v6, atualizar para react-router 7, rodar o portão --final; hoje o app só navega para caminhos fixos, então o risco é baixo.

  - id: remover-recomeco-aparelho
    titulo: Remover o recomeço do aparelho (src/lib/recomeco.ts)
    due: 2027-06-30
    alert_days: 30
    acao: Até lá quase todo aparelho já passou pelo recomeço da troca planilha → Supabase. Apagar recomeco.ts (+ teste), a chamada em main.tsx e marcarMigrado/cenários do e2e; a marca school-data-version pode ficar gravada nos aparelhos. Atualizar DOC §4 e PRD §3.1.

  - id: revisar-cota-google
    titulo: Revisar preços e cota grátis da Routes API do Google (Compute Route Matrix)
    due: 2027-11-01
    alert_days: 30
    link: https://developers.google.com/maps/billing-and-pricing/pricing
    acao: Conferir se a cota grátis mensal continua 10.000 elementos e se a cobrança por elemento mudou. Se mudou, ajustar COTA_MENSAL, LIMIAR_ECONOMIA e TETO_MENSAL em src/lib/cota.ts, os tetos diário/por minuto no Google Cloud (hoje 3.300/dia e 700/min) e o PRD §3.3. Recorrente: depois, avançar a data um ano.

  - id: turmas-limite-1000-linhas
    titulo: Turmas do Supabase perto do limite de 1000 linhas por GET do PostgREST
    due: 2027-10-01
    alert_days: 30
    acao: Hoje são 839 turmas (só 2027) num único GET em src/lib/escolasSupabase.ts. Quando a SME publicar o ano letivo seguinte junto, passa de 1000 e as turmas vêm cortadas sem erro. Antes disso, filtrar por ano_letivo na consulta ou paginar (header Range), e conferir a contagem com a view turmas_por_etapa.
